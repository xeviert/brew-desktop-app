[package]
name = "brew-app"
version = "0.1.0"
description = "Brewery operating system on top of Fermentrack"
authors = ["xeviert"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# Thin shell only: window setup, app state, and command handlers that delegate
# straight into `brewcore`. No logic lives here.
[lib]
name = "brew_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
brewcore.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2.11.3", features = [] }
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
