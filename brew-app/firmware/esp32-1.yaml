# ESP32 #1 — DS18B20 on GPIO13, publishing to Mosquitto on the Pi.
# No api: (no Home Assistant) and no thermostat until temp control (see docs/HARDWARE.md).

esphome:
  name: esp32-1

esp32:
  board: esp32doit-devkit-v1
  framework:
    type: esp-idf

logger:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

ota:
  - platform: esphome
    password: !secret ota_password

mqtt:
  broker: 192.168.1.28
  username: devices
  password: !secret mqtt_password
  # Discovery publishes homeassistant/... config topics nobody reads.
  discovery: false

one_wire:
  - platform: gpio
    pin: GPIO13

sensor:
  # Topic: esp32-1/sensor/vessel_temp/state. Pin `address:` once the boot log shows it.
  - platform: dallas_temp
    name: vessel_temp
    update_interval: 30s
