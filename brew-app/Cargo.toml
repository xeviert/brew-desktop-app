[workspace]
resolver = "2"
members = ["src-tauri", "crates/brewcore", "xtask"]

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
brewcore = { path = "crates/brewcore" }

rusqlite = { version = "0.40", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.35"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"

tempfile = "3"

[profile.dev]
# rusqlite's bundled SQLite is C; building it unoptimised makes every test slow.
[profile.dev.package.libsqlite3-sys]
opt-level = 2
