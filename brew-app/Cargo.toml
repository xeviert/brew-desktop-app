[workspace]
resolver = "2"
members = ["src-tauri", "crates/brewcore", "crates/brewd", "crates/fixtures", "xtask"]

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
brewcore = { path = "crates/brewcore" }
brewfixture = { path = "crates/fixtures" }

rusqlite = { version = "0.40", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.35"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "1"
tracing = "0.1"
# Only the Tauri shell installs a subscriber; `brewcore` is a library and must not.
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "ansi", "registry", "time"] }
tracing-appender = "0.2"

# Phase 2b's parser. `csv` for header-driven reading with Python's `excel` dialect
# honoured (annotations contain commas and quotes); `chrono` for the one fixed
# `%Y/%m/%d %H:%M:%SZ` format. `chrono` without `clock` or `serde`: the parser only
# needs `NaiveDateTime::parse_from_str`, and `Timestamp` already owns "now".
csv = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }

tempfile = "3"
# Phase 2a's test rig and Phase 2c's client. `wiremock` is how the mock Fermentrack
# serves a growing file; `tokio`'s `time` is 2c's retry backoff; `reqwest` is the
# fetch itself, and its `Url` re-export is what `config::validate` parses a base_url
# with. `rustls` rather than schannel so Windows and CI behave alike.
wiremock = "0.6"
# Phase 2g. `ReadingSource` has to be object-safe: the scheduler holds
# `Box<dyn ReadingSource>` so that v2's MQTT source is a new impl rather than a new
# scheduler. Native async-fn-in-trait is not `dyn`-safe on our MSRV.
async-trait = "0.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "charset"] }

# Phase Vc, `brewd` only — the desktop app never links an MQTT client or an HTTP
# server. `rumqttc` without TLS: the broker is on the LAN, and `rustls`' default
# crypto provider is C and assembly the Pi cross-build does not need. `tower-http`'s
# `ServeFile` is what answers `Range` with the 206/416 semantics `journal::Client`
# already handles; 0.6 is the line Tauri already locks.
rumqttc = { version = "0.25", default-features = false }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "tracing"] }
tower-http = { version = "0.6", features = ["fs"] }
tower = { version = "0.5", features = ["util"] }

[profile.dev]
# rusqlite's bundled SQLite is C; building it unoptimised makes every test slow.
[profile.dev.package.libsqlite3-sys]
opt-level = 2
