# brewd config. Install as /etc/brewd/brewd.toml, readable by the `brewd` user only:
# it holds the broker password.
#
# Topics below are placeholders until the Phase 0 captures exist. Take the real ones
# from `mosquitto_sub -v -t '#'`, not from this file.

# systemd's StateDirectory=brewd creates this.
journal_dir = "/var/lib/brewd/journals"

# Phase 6: watches.json, alerts.json and the alert log alerts.csv. The default.
state_dir = "/var/lib/brewd"

# A device's messages within this long of its first one are one reading, stamped
# once. The iSpindle publishes a wake cycle as a burst of one topic per field.
burst_window_ms = 2000

[http]
# LAN-only. Reads need no auth.
listen = "0.0.0.0:8080"
# Writes (the desktop pushing watches, ack, snooze) need this as a Bearer token, and
# are refused without one. Paste the same value into the app's Settings.
# Generate one with: openssl rand -hex 16
token = "change-me-to-32-hex-characters!!"

# Where alerts are pushed. Leave the section out to only log them. On ntfy.sh the
# topic is the secret — anyone who knows it can read it — so make it long and random.
[notify]
ntfy_server = "https://ntfy.sh"
ntfy_topic = "brewery-change-me"
# ntfy_token = "tk_..."   # for a server with access control

[mqtt]
host = "localhost"
port = 1883
client_id = "brewd"
username = "brewd"
password = "change-me"

# One journal per device: <journal_dir>/<name>.csv. Column order is header order.
# Values are journalled as published — no unit conversion. Whether `gravity` is SG
# or °P is the desktop app's `gravity.ispindel_unit`.
[[device]]
name = "ispindel-1"
columns = [
    { topic = "ispindel/ispindel-1/tilt", column = "tilt" },
    { topic = "ispindel/ispindel-1/gravity", column = "gravity" },
    { topic = "ispindel/ispindel-1/temperature", column = "temperature" },
    { topic = "ispindel/ispindel-1/battery", column = "battery" },
    { topic = "ispindel/ispindel-1/RSSI", column = "rssi" },
    { topic = "ispindel/ispindel-1/interval", column = "interval" },
]

# ESPHome's default state topic is <node>/sensor/<sensor>/state.
[[device]]
name = "esp32-1"
columns = [
    { topic = "esp32-1/sensor/vessel_temp/state", column = "vessel_temp" },
    { topic = "esp32-1/sensor/chamber_temp/state", column = "chamber_temp" },
]
