[package]
name = "brewcore"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# This crate must never depend on `tauri`, directly or transitively: it is what
# makes every piece of logic testable with a plain `cargo test`, and what lets the
# future controller (see docs/BUILDOUT.md "Keeping the Option 2 door open") reuse
# it. `tests/no_tauri.rs` enforces this.
[dependencies]
rusqlite.workspace = true
r2d2.workspace = true
r2d2_sqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
toml.workspace = true
# `tracing` only. Installing a subscriber is the binary's job, never a library's:
# `tracing-subscriber` here would make `cargo test -p brewcore` noisy and would let
# two subscribers race at startup.
tracing.workspace = true
# Phase 2b. `csv` because Fermentrack writes with Python's `excel` dialect and
# `beer_ann` is free text: `split(',')` eats a row the first time an annotation
# contains a comma. `chrono` for `log_time`, whose format is fixed and always UTC.
csv.workspace = true
chrono.workspace = true
# Phase 2c. `reqwest` is the Fermentrack fetch; its `Url` re-export is also what
# `config::validate` parses a base_url with, so there is no separate `url` dep.
# `tokio` is `time::sleep` for the retry backoff and `#[tokio::test]` for this
# crate's first async tests — this crate installs no runtime of its own, exactly as
# it installs no tracing subscriber.
reqwest.workspace = true
tokio.workspace = true
# Phase 2g. `ReadingSource` must be object-safe so the scheduler can hold
# `Box<dyn ReadingSource>`; native async-fn-in-trait is not.
async-trait.workspace = true

[dev-dependencies]
tempfile.workspace = true
# `test-util` for `tokio::time::pause`: the scheduler's backoff reaches fifteen
# minutes, and a test must not. Features are additive, so this only affects tests.
tokio = { workspace = true, features = ["test-util"] }
# The parser's oracle. `brewfixture` has no `brewcore` dependency, by design: a
# generator that shared the parser's date maths or CSV quoting could not catch a bug
# in either. Dev-only, so nothing ships with the app.
#
# `features = ["serve"]` is not implied by `workspace = true` — the workspace entry
# is a bare path with no features, and the mock server is behind `serve` so that
# `cargo xtask gen-fixture` does not build an HTTP stack to write a file.
brewfixture = { workspace = true, features = ["serve"] }
